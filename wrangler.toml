name = "arcade-points"
main = "custom-worker.js"
compatibility_date = "2026-08-19"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Fires once daily at 15:00 UTC (20:30 IST) — a reasonable single
# time to catch people before a large share of the day is over,
# though with a genuinely global audience there's no one time that
# works for everyone. Adjust the cron expression here if a different
# time turns out to work better once this has real usage data behind
# it.
[triggers]
crons = ["0 15 * * *"]

# Cloudflare's native Email Service binding — the only viable way to
# send email from a Worker, since Workers run in V8 isolates with no
# raw TCP socket access, which rules out SMTP-based libraries
# entirely. Requires the sending domain (tapandscore.com) to be
# onboarded for Email Sending in the Cloudflare dashboard under
# Email Service, and Email Sending itself is only available on the
# Workers Paid plan — see README.md for the full manual setup
# this specific piece needs.
[[send_email]]
name = "EMAIL"
remote = true

# These two values are DESIGNED to be public — "anon public key" means
# it's safe for anyone to see, since Supabase's security rules (not
# secrecy) protect your data. Putting them here guarantees they're
# available both when the site is being built AND when it's running.
[vars]
NEXT_PUBLIC_SUPABASE_URL = "https://bopgqmomqckinkcezdro.supabase.co"
NEXT_PUBLIC_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJvcGdxbW9tcWNraW5rY2V6ZHJvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyMTk4MjEsImV4cCI6MjEwMjc5NTgyMX0.M75JwfZ2H9UmlH_HYSaM7cXx1Mtv_kDbF45IoApKYrw"
# Empty on purpose — this repo doesn't know your real Cloudflare Web
# Analytics token, so it ships blank. CloudflareAnalytics.js renders
# nothing at all until this is filled in, rather than a broken script
# tag. Get a real token from the Cloudflare dashboard: Analytics &
# Logs -> Web Analytics -> Add a site -> Manual Setup (this works
# even if tapandscore.com isn't proxied through Cloudflare's DNS — it
# doesn't require that). Paste the token here, same as the two keys
# above — it's a public site identifier, not a secret, safe to commit.
NEXT_PUBLIC_CF_ANALYTICS_TOKEN = ""

# Everything else (SUPABASE_SERVICE_ROLE_KEY, RAZORPAY_KEY_ID,
# RAZORPAY_KEY_SECRET, NEXT_PUBLIC_SITE_URL) stays OUT of this file on
# purpose — those are genuinely secret, so they belong only in the
# Cloudflare dashboard under Workers & Pages -> arcade-points -> Settings
# -> Variables and Secrets, never committed to GitHub.
