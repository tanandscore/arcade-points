name = "arcade-points"
main = ".open-next/worker.js"
compatibility_date = "2026-08-19"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# These two values are DESIGNED to be public — "anon public key" means
# it's safe for anyone to see, since Supabase's security rules (not
# secrecy) protect your data. Putting them here guarantees they're
# available both when the site is being built AND when it's running.
[vars]
NEXT_PUBLIC_SUPABASE_URL = "https://bopgqmomqckinkcezdro.supabase.co"
NEXT_PUBLIC_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJvcGdxbW9tcWNraW5rY2V6ZHJvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyMTk4MjEsImV4cCI6MjEwMjc5NTgyMX0.M75JwfZ2H9UmlH_HYSaM7cXx1Mtv_kDbF45IoApKYrw"

# Everything else (SUPABASE_SERVICE_ROLE_KEY, RAZORPAY_KEY_ID,
# RAZORPAY_KEY_SECRET, NEXT_PUBLIC_SITE_URL) stays OUT of this file on
# purpose — those are genuinely secret, so they belong only in the
# Cloudflare dashboard under Workers & Pages -> arcade-points -> Settings
# -> Variables and Secrets, never committed to GitHub.
