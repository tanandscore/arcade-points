<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Tap & Score — We'll be right back</title>
<style>
  /*
    This file is deliberately 100% self-contained: no npm packages, no
    build step, no imports from the main app, nothing that requires
    `next build` to succeed. It talks directly to Supabase's REST API
    using the project's public URL and anon key (the same ones already
    embedded client-side throughout the main app — designed to be
    public; Supabase's row-level security, not secrecy, is what
    protects the data).

    The point: if every other file and folder in this repo is deleted
    and only this one file remains, deploying that (as a static site,
    no build command) still serves a real, working, on-brand
    maintenance page that correctly reflects live admin settings — and
    once the full app is re-uploaded and maintenance mode is switched
    off from /admin, this page detects that and reloads into the real
    site automatically.
  */
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;600;700&display=swap');
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; min-height: 100vh;
    background: radial-gradient(circle at 50% 0%, #1d1046 0%, #12092b 55%);
    color: #f5f0ff;
    font-family: 'Space Grotesk', sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  .scanlines {
    position: fixed; inset: 0; pointer-events: none;
    background-image: repeating-linear-gradient(to bottom, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 3px);
  }
  .card { text-align: center; max-width: 420px; padding: 24px; }
  .icon { font-size: 40px; margin-bottom: 18px; }
  .brand { font-family: 'Press Start 2P', monospace; font-size: 11px; color: #ffb703; margin-bottom: 18px; letter-spacing: 1px; }
  .message { color: #a99fd6; font-size: 14px; line-height: 1.6; margin-bottom: 20px; }
  .countdown {
    display: none; gap: 10px; justify-content: center; margin: 22px 0;
    font-family: 'Press Start 2P', monospace;
  }
  .countdown.active { display: flex; }
  .countdown .unit { text-align: center; }
  .countdown .num { font-size: 20px; color: #3ee6e0; }
  .countdown .lbl { font-size: 8px; color: #a99fd6; margin-top: 6px; }
  .note {
    border: 1px solid rgba(62,230,224,0.4); background: rgba(62,230,224,0.08);
    border-radius: 8px; padding: 12px; margin-top: 18px; text-align: left;
    font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #3ee6e0; line-height: 1.6;
  }
  .checking { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #a99fd6; margin-top: 14px; }
  .btn {
    font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #f5f0ff;
    background: transparent; border: 1px solid rgba(169,159,214,0.3); border-radius: 6px;
    padding: 8px 16px; cursor: pointer; margin-top: 10px;
  }
  .btn:hover { border-color: #f5f0ff; }
</style>
</head>
<body>
<div class="scanlines"></div>
<div class="card">
  <div class="icon">🛠️</div>
  <div class="brand">TAP &amp; SCORE</div>
  <div class="message" id="message">Checking site status…</div>
  <div class="countdown" id="countdown">
    <div class="unit"><div class="num" id="cd-days">--</div><div class="lbl">DAYS</div></div>
    <div class="unit"><div class="num" id="cd-hours">--</div><div class="lbl">HRS</div></div>
    <div class="unit"><div class="num" id="cd-mins">--</div><div class="lbl">MIN</div></div>
    <div class="unit"><div class="num" id="cd-secs">--</div><div class="lbl">SEC</div></div>
  </div>
  <div class="note">Your game progress is saved — you'll be able to jump right back in the moment we're back.</div>
  <button class="btn" id="check-btn" onclick="checkStatus()">Check now</button>
  <div class="checking" id="checking-note">Checking automatically every 15 seconds.</div>
</div>
<script>
  // Same project URL and public anon key already used client-side
  // throughout the main app — see lib/supabaseClient.js there.
  var SUPABASE_URL = "https://bopgqmomqckinkcezdro.supabase.co";
  var SUPABASE_ANON_KEY = "sb_publishable_UKtSNB2lnCBrHMI84GZpuA_DZ4GGu0o";

  var countdownInterval = null;

  function startCountdown(targetIso, label) {
    var el = document.getElementById("countdown");
    el.classList.add("active");
    document.getElementById("message").textContent = label || "Launching soon";
    function tick() {
      var diff = new Date(targetIso).getTime() - Date.now();
      if (diff <= 0) {
        clearInterval(countdownInterval);
        el.classList.remove("active");
        document.getElementById("message").textContent = "Almost there…";
        return;
      }
      var days = Math.floor(diff / 86400000);
      var hours = Math.floor((diff % 86400000) / 3600000);
      var mins = Math.floor((diff % 3600000) / 60000);
      var secs = Math.floor((diff % 60000) / 1000);
      document.getElementById("cd-days").textContent = String(days).padStart(2, "0");
      document.getElementById("cd-hours").textContent = String(hours).padStart(2, "0");
      document.getElementById("cd-mins").textContent = String(mins).padStart(2, "0");
      document.getElementById("cd-secs").textContent = String(secs).padStart(2, "0");
    }
    tick();
    clearInterval(countdownInterval);
    countdownInterval = setInterval(tick, 1000);
  }

  function checkStatus() {
    var btn = document.getElementById("check-btn");
    btn.disabled = true;
    btn.textContent = "Checking...";
    fetch(SUPABASE_URL + "/rest/v1/site_settings?select=maintenance_mode,maintenance_message,launch_countdown_at,launch_countdown_label&id=eq.1", {
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY },
      cache: "no-store"
    })
      .then(function (res) { return res.json(); })
      .then(function (rows) {
        var row = rows && rows[0];
        btn.disabled = false;
        btn.textContent = "Check now";
        if (!row || !row.maintenance_mode) {
          document.getElementById("message").textContent = "We're back — reloading…";
          document.getElementById("checking-note").textContent = "";
          btn.style.display = "none";
          setTimeout(function () { window.location.reload(); }, 1200);
          return;
        }
        document.getElementById("message").textContent = row.maintenance_message || "Game engine updating — we'll be shortly back.";
        if (row.launch_countdown_at && new Date(row.launch_countdown_at).getTime() > Date.now()) {
          startCountdown(row.launch_countdown_at, row.launch_countdown_label);
        }
      })
      .catch(function () {
        btn.disabled = false;
        btn.textContent = "Check now";
        document.getElementById("checking-note").textContent = "Couldn't reach the server — we'll keep trying automatically.";
      });
  }

  checkStatus();
  setInterval(checkStatus, 15000);
</script>
</body>
</html>
